<svg xmlns="http://www.w3.org/2000/svg" width="402" height="26" viewBox="0 0 402 26" fill="none" aria-hidden="true">
<!-- 5.0.969: light paper in the reference has a straight horizontal shoulder concealed by the kraft fold.
     Reconstruction of ONLY visible edges, measured from a flattened 1536x576 mock.
     The sheet stack is matte ivory, not pure white; no raised rounded hump or ribbon. -->
<defs>
  <linearGradient id="rear" x1="0" y1="7" x2="0" y2="26" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F5F2EB"/><stop offset=".47" stop-color="#EDE9DF"/><stop offset="1" stop-color="#DCCFC1"/>
  </linearGradient>
  <linearGradient id="rim1" x1="0" y1="11" x2="0" y2="26" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FEFCF6"/><stop offset=".53" stop-color="#F0EADC"/><stop offset="1" stop-color="#DCCAB6"/>
  </linearGradient>
  <linearGradient id="rim2" x1="0" y1="13" x2="0" y2="26" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FBF8F0"/><stop offset=".57" stop-color="#EDE3D5"/><stop offset="1" stop-color="#DAC8B4"/>
  </linearGradient>
  <linearGradient id="rim3" x1="0" y1="15" x2="0" y2="26" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F9F5ED"/><stop offset=".55" stop-color="#EFE6D9"/><stop offset="1" stop-color="#DBCCBA"/>
  </linearGradient>
</defs>
<!-- Paper sheet BEHIND the kraft fold: low, long, almost straight at its visible top -->
<path d="M140 26 L155 13.7 Q159 9.85 170 9.35 L254 9.10 Q263 9.20 266 9.8 L277 23 L281 26 Z"
      fill="url(#rear)" stroke="#C8BDAC" stroke-width=".30" stroke-linejoin="round"/>
<path d="M170 9.94 Q214 9.57 254 9.76" stroke="#FFFFFF" stroke-opacity=".75" stroke-width=".38"/>
<path d="M171 10.48 L253 10.38" stroke="#999486" stroke-opacity=".23" stroke-width=".28"/>
<!-- Three staggered lower rims: thin, with stepped tops; not a continuous long white wedge -->
<path d="M195 26 L215 19.15 Q226 14.8 240 14.25 L279 14.15 L285 15.9 L294 26 Z"
      fill="url(#rim1)" stroke="#CDBEAC" stroke-width=".30"/>
<path d="M240 14.79 L278 14.7" stroke="#FFFEF9" stroke-opacity=".64" stroke-width=".36"/>
<path d="M232 26 L247 20.9 Q257 17.3 268 17.2 L310 17.2 Q315 17.4 319 19.3 L326 26 Z"
      fill="url(#rim2)" stroke="#CDBBA8" stroke-width=".28"/>
<path d="M268 17.75 L310 17.76" stroke="#FFF9EF" stroke-opacity=".58" stroke-width=".35"/>
<path d="M257 26 L273 22.9 Q283 20.5 295 20.45 L319 20.4 Q323 20.5 327 21.65 L334 26 Z"
      fill="url(#rim3)" stroke="#CDBEAD" stroke-width=".28"/>
<path d="M295 20.94 L319 20.96" stroke="#FFFCF7" stroke-opacity=".55" stroke-width=".32"/>
</svg>
