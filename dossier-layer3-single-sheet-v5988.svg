<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 50" width="402" height="50" fill="none" aria-hidden="true">
  <!-- 5.0.988: A single thin sheet emerging naturally from behind the left kraft fold.
       Its long shallow shoulder is hidden by the existing kraft layer; only the
       upper, narrow ivory paper lip is exposed. The rear leather and front cover
       remain untouched. -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="12.4" x2="0" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCFCF9"/>
      <stop offset=".35" stop-color="#F8F7F2"/>
      <stop offset=".72" stop-color="#F0EEE8"/>
      <stop offset="1" stop-color="#E8E4DD"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="12.4" x2="0" y2="16.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".66"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Lengthened left insertion: only the upper slope is revealed by the kraft. -->
  <path d="M113 50 L122 29 Q129 19 147 14.6 C158.5 12.8 177.5 12.55 196.5 12.5 C220 12.25 247.4 12.25 264 12.4 L270 12.6 L278.7 19.6 L278.7 50 Z"
        fill="url(#leaf)" stroke="#D5D0C9" stroke-width=".44" stroke-linejoin="round"/>
  <path d="M147.3 15 C159.5 13.15 179.2 12.9 196.7 12.9 C224.2 12.65 248.5 12.65 264.2 12.8 L269.8 13.1 L278.2 19.6"
        fill="none" stroke="#FFFFFF" stroke-opacity=".63" stroke-width=".72" stroke-linecap="round"/>
  <path d="M196.5 13.15 C222 13.05 248.8 13.05 264 13.05 L269.4 13.35 L278.1 19.6"
        fill="none" stroke="url(#edge)" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M194 13.8 C222.5 13.5 250 13.45 269 13.8" fill="none" stroke="#B4B7B4" stroke-opacity=".15" stroke-width=".32"/>
</svg>
