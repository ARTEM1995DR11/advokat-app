<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 50" width="402" height="50" fill="none" aria-hidden="true">
  <!-- Build 5982. One broad warm-ivory paper leaf. It sits behind the kraft
       folder and above the coloured rear tab, but visibly rises over the front
       ivory panel as in the approved mockup. -->
  <defs>
    <linearGradient id="paperBody" x1="0" y1="8" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCFBF8"/>
      <stop offset=".18" stop-color="#F9F8F4"/>
      <stop offset=".58" stop-color="#F3EFE8"/>
      <stop offset="1" stop-color="#E9E2D8"/>
    </linearGradient>
    <linearGradient id="topTint" x1="0" y1="8" x2="0" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="contactLeft" x1="28" y1="36" x2="72" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#877664" stop-opacity=".19"/>
      <stop offset="1" stop-color="#877664" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="contactBottom" x1="0" y1="42" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A89A89" stop-opacity="0"/>
      <stop offset="1" stop-color="#B9AB98" stop-opacity=".16"/>
    </linearGradient>
  </defs>

  <!-- Single silhouette: a broad sheet with a tucked left shoulder and a
       straight right shoulder / corner, without a second overlapping page. -->
  <path d="M4 50 L4 36.5 C18.5 33.8 31.5 28.4 43.3 20.9 C50.6 16.3 58.9 12.7 71.2 10.2 C97.4 5.1 145.8 7.1 203.8 6.6 C261.5 6.1 315.8 6.3 381.1 7.3 L389.8 7.5 L389.8 50 Z"
        fill="url(#paperBody)" stroke="#D7D0C8" stroke-width=".55" stroke-linejoin="round"/>

  <path d="M70.6 10.4 C98.6 6.1 148 8.2 203.8 7.7 C261.2 7.2 315.3 7.4 388.4 8.45"
        fill="none" stroke="#FFFFFF" stroke-opacity=".68" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M70.7 11.6 C98.4 7.9 147.6 9.6 203.8 9.1 C261.2 8.6 315.3 8.9 388.6 9.7"
        fill="none" stroke="#C7BEB5" stroke-opacity=".54" stroke-width=".72" stroke-linecap="round"/>
  <path d="M73.4 9.4 H389.2 V15.8 H61.1 C66.2 13.1 69.6 11.1 73.4 9.4 Z" fill="url(#topTint)"/>
  <path d="M389.2 7.8 V17.9" stroke="#C0BAB2" stroke-opacity=".70" stroke-width=".72"/>
  <path d="M4.3 49 H389.4" stroke="url(#contactBottom)" stroke-width="1.35"/>
  <path d="M18.6 31.9 C32.4 27.6 43.4 21.5 51.3 16.8 C58 12.9 63.6 11.2 74.8 10.1"
        fill="none" stroke="url(#contactLeft)" stroke-width="1.05" stroke-linecap="round"/>
</svg>
