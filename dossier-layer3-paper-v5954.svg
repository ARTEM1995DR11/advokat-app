<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 26" width="402" height="26" fill="none" aria-hidden="true">
<!-- Build 5966. Geometry correction in the SAME Layer 3 asset:
     four short, non-collinear paper lips; the long arc has been removed.
     No changes to layer 1, 2, 4, image registration or dynamic content. -->
<defs>
  <linearGradient id="paperA" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#F3EDE2"/><stop offset=".56" stop-color="#ECE3D5"/><stop offset="1" stop-color="#DDD0BD"/>
  </linearGradient>
  <linearGradient id="paperB" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#F8F2E8"/><stop offset=".57" stop-color="#F0E7D9"/><stop offset="1" stop-color="#DFD1BE"/>
  </linearGradient>
  <linearGradient id="paperC" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#FAF6EE"/><stop offset=".55" stop-color="#F3EBDD"/><stop offset="1" stop-color="#E1D4C0"/>
  </linearGradient>
  <linearGradient id="paperD" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#FCF9F2"/><stop offset=".55" stop-color="#F5EEDF"/><stop offset="1" stop-color="#E5D7C4"/>
  </linearGradient>
</defs>
<g transform="translate(16 1.05)">
  <!-- Leaf A: the rear page exposes only a short, left-hand folded crest. -->
  <path d="M245 26 L252 20.7 L263 13.5 Q267 11.5 271 11.45 L282 11.6 Q287 12.1 293 17.8 L300 26 Z"
        fill="url(#paperA)" stroke="#CBB8A1" stroke-width=".34"/>
  <path d="M268 12.05 L282 12.22" stroke="#FFF9F0" stroke-width=".37" opacity=".50" stroke-linecap="round"/>
  <path d="M268 12.82 L282 12.99" stroke="#AA9177" stroke-width=".32" opacity=".20" stroke-linecap="round"/>

  <!-- Leaf B: a higher, narrow overlap that hides the A tail rather than extending it. -->
  <path d="M271 26 L278 21.0 L289 12.4 Q293 10.3 297 10.25 L308 10.42 Q313 11 319 17.8 L327 26 Z"
        fill="url(#paperB)" stroke="#CAB9A5" stroke-width=".32"/>
  <path d="M293.7 10.99 L307.6 11.17" stroke="#FFFAF2" stroke-width=".37" opacity=".55" stroke-linecap="round"/>
  <path d="M293.7 11.75 L307 11.9" stroke="#AD947C" stroke-width=".30" opacity=".22" stroke-linecap="round"/>

  <!-- Leaf C: a lower stagger; discrete lip, not an unbroken ridge. -->
  <path d="M297 26 L305 21.4 L317 14.2 Q321 12.1 326 12.0 L338 12.2 Q344 12.9 349 18.7 L355 26 Z"
        fill="url(#paperC)" stroke="#CFBEAA" stroke-width=".30"/>
  <path d="M322.1 12.74 L337.8 12.9" stroke="#FFFBF2" stroke-width=".34" opacity=".51" stroke-linecap="round"/>
  <path d="M323 13.48 L337.5 13.61" stroke="#AB9078" stroke-width=".28" opacity=".17" stroke-linecap="round"/>

  <!-- Leaf D: a final right-hand shorter corner, tucked beneath layer 4's shoulder. -->
  <path d="M322 26 L332 21.8 L344 15.8 Q349 13.4 353 13.35 L365 13.6 Q369 14.2 374 21 L379 26 Z"
        fill="url(#paperD)" stroke="#D1C0AB" stroke-width=".29"/>
  <path d="M349 14.05 L364 14.28" stroke="#FFF9F0" stroke-width=".30" opacity=".50" stroke-linecap="round"/>
</g>
</svg>
