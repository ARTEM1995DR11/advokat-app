<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 26" width="402" height="26" fill="none" aria-hidden="true">
<!-- 5.0.964 / build 5964. Layer 3, Step 1: keep the same SVG resource and warm ivory palette,
     but remove the overly broad white wedge. The exposed sheets now begin later,
     read as short staggered paper edges, and overlap more naturally beneath the ivory face. -->
