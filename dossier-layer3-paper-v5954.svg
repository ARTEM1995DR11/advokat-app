<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 26" width="402" height="26" fill="none" aria-hidden="true">
<!-- Build 5965. Existing Layer 3 SVG: short, separate staggered paper lips instead
     of one long continuous diagonal white wedge. Layer order / registration unchanged. -->
<defs>
  <linearGradient id="paperA" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#F3EDE2"/><stop offset=".56" stop-color="#ECE3D5"/><stop offset="1" stop-color="#DDD0BD"/>
  </linearGradient>
  <linearGradient id="paperB" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#F8F2E8"/><stop offset=".57" stop-color="#F0E7D9"/><stop offset="1" stop-color="#DFD1BE"/>
  </linearGradient>
  <linearGradient id="paperC" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#FAF6EE"/><stop offset=".55" stop-color="#F3EBDD"/><stop offset="1" stop-color="#E1D4C0"/>
  </linearGradient>
  <linearGradient id="paperD" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#FCF9F2"/><stop offset=".55" stop-color="#F5EEDF"/><stop offset="1" stop-color="#E5D7C4"/>
  </linearGradient>
</defs>
<g transform="translate(16 1.05)">
  <!-- Short rear paper lip; front edge retreats beneath the ivory cover. -->
  <path d="M219 26 Q238 22 248 15.6 Q254 11.2 260 10.1 C270 9.8 280 10.0 288 10.5 Q297 11.6 305 17.5 L312 26 Z"
        fill="url(#paperA)" stroke="#CBB8A1" stroke-width=".35"/>
  <path d="M260 10.6 Q273 10.2 288 11.0" stroke="#FFF9F0" stroke-width=".48" opacity=".48" stroke-linecap="round"/>
  <!-- A second offset lip, overlapping the rear sheet but not tracing it. -->
  <path d="M251 26 Q267 21.1 278 15.3 Q284 11.2 290 9.6 C301 9.2 313 9.5 323 10.2 Q332 11.3 339 17.1 L345 26 Z"
        fill="url(#paperB)" stroke="#CFBEA9" stroke-width=".34"/>
  <path d="M291 10.2 Q306 9.8 322 10.8" stroke="#FFFAF2" stroke-width=".44" opacity=".49" stroke-linecap="round"/>
  <!-- Third staggered sheet: a narrow, slightly brighter edge. -->
  <path d="M285 26 Q299 21.4 309 15.5 Q315 11.3 320 9.7 C331 9.4 342 9.7 354 10.4 Q361 11.4 368 17.8 L375 26 Z"
        fill="url(#paperC)" stroke="#D0C1AD" stroke-width=".34"/>
  <path d="M322 10.4 Q336 10.1 353 11.1" stroke="#FFFBF2" stroke-width=".42" opacity=".5" stroke-linecap="round"/>
  <!-- Fourth, most forward lip; terminates beneath the cover's right shoulder. -->
  <path d="M314 26 Q325 21 335 16.0 Q340 12.8 346 11.6 C354 11.3 363 11.5 368 12.6 Q372 15 375 20.2 L378 26 Z"
        fill="url(#paperD)" stroke="#D1C2B0" stroke-width=".32"/>
  <path d="M346 12.4 Q355 12.0 368 13.1" stroke="#FFFCF6" stroke-width=".4" opacity=".48" stroke-linecap="round"/>
</g>
</svg>
