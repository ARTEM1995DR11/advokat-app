<!DOCTYPE html>

  <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></g>

  <path fill="currentColor" stroke="none" d="M6.7 19.1h10.6l1.25 2H5.45z"/>

  <path fill="currentColor" stroke="none" d="M4.4 6.1 7.9 12H.9zm15.2 0L23.1 12h-7z"/>
  <path fill="currentColor" stroke="none" d="M.85 12.15h7.1c-.2 2.6-1.55 4.2-3.55 4.2s-3.35-1.6-3.55-4.2zm15.2 0h7.1c-.2 2.6-1.55 4.2-3.55 4.2s-3.35-1.6-3.55-4.2z"/>
  <path fill="currentColor" stroke="none" d="m11.4 4.05-5.5 2.25.62 1.5L12 5.55l5.48 2.25.62-1.5-5.5-2.25z"/>
</g>

<div id="app">
  <div class="screen" id="sc-today"></div>
  <div class="screen hide" id="sc-tasks"></div>
  <div class="screen hide" id="sc-matters"></div>
  <div class="screen hide" id="sc-cal"></div>
  <div class="screen hide" id="sc-more"></div>
</div>

<div class="timerpill" id="pill">
  <span class="dot"></span><b class="mono" id="pill-t">00:00</b><span id="pill-n"></span>
  <button id="pill-stop" style="color:var(--dang);display:flex"><svg class="ico s" viewBox="0 0 24 24"><use href="#i-stop"/></svg></button>
</div>

<button class="fab" id="fab"><svg class="ico" viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>

<nav class="tabbar" id="tabbar">
  <button class="tab on" data-tab="today"><svg class="ico" viewBox="0 0 24 24"><use href="#i-sun"/></svg>Сегодня</button>
  <button class="tab" data-tab="tasks"><svg class="ico" viewBox="0 0 24 24"><use href="#i-list"/></svg>Задачи</button>
  <button class="tab" data-tab="matters"><svg class="ico" viewBox="0 0 24 24"><use href="#i-folder"/></svg>Дела</button>
  <button class="tab" data-tab="cal"><svg class="ico" viewBox="0 0 24 24"><use href="#i-cal"/></svg>Календарь</button>
  <button class="tab" data-tab="more"><svg class="ico" viewBox="0 0 24 24"><use href="#i-more"/></svg>Ещё</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="sheet full" id="page"></div>
<div class="toast" id="toast"></div>
<div id="printarea"></div>

<div id="lock">
  <div class="lg"><svg class="ico" viewBox="0 0 24 24" style="width:34px;height:34px"><use href="#i-scale"/></svg></div>
  <h2>Ежедневник адвоката</h2>
  <p id="lock-msg">Введите код доступа</p>
  <div class="dots" id="lock-dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="lock-pad"></div>
</div>

<input type="file" id="file" accept=".json" style="display:none">
<script src="app.js?v=3114"></script>
</body>
</html>
