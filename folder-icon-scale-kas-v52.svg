<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" role="img" aria-label="Весы правосудия">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4308"/>
      <stop offset="0.18" stop-color="#d79a25"/>
      <stop offset="0.36" stop-color="#fff1a3"/>
      <stop offset="0.52" stop-color="#c98212"/>
      <stop offset="0.72" stop-color="#f8cb58"/>
      <stop offset="1" stop-color="#7d4709"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e3103"/>
      <stop offset="0.5" stop-color="#a45f08"/>
      <stop offset="1" stop-color="#4c2600"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="38%" cy="24%" r="78%">
      <stop offset="0" stop-color="#fff8c7"/>
      <stop offset="0.28" stop-color="#ffd86a"/>
      <stop offset="0.62" stop-color="#b9680b"/>
      <stop offset="1" stop-color="#6f3a04"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#5b3608" flood-opacity=".32"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation=".55"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- top finial -->
    <circle cx="90" cy="13" r="5.6" fill="url(#goldGlow)" stroke="#6f3d05" stroke-width="1.2"/>
    <ellipse cx="88.6" cy="11.7" rx="2.4" ry="1.7" fill="#fff5b8" opacity=".88"/>

    <!-- vertical stem -->
    <path d="M86.2 18.2 C86.2 24 84.8 28.5 84.8 35.5 L84.8 100.2 C84.8 106.8 81.5 111.2 78.6 115.3 H101.4 C98.5 111.2 95.2 106.8 95.2 100.2 V35.5 C95.2 28.5 93.8 24 93.8 18.2 Z" fill="url(#gold)" stroke="#774206" stroke-width="1.3"/>
    <path d="M89 21.5 V101.5" stroke="#fff1a5" stroke-width="2" opacity=".72"/>
    <path d="M95.2 27.8 V99.5" stroke="#6c3903" stroke-width="1.3" opacity=".55"/>

    <!-- cross beam -->
    <path d="M20 34.8 C40 35.8 57.8 32.8 75 27.8 C81.6 25.8 86.1 23.8 90 23.2 C93.9 23.8 98.4 25.8 105 27.8 C122.2 32.8 140 35.8 160 34.8" fill="none" stroke="#6f3b04" stroke-width="8.4" stroke-linecap="round"/>
    <path d="M20 32.6 C40 33.7 58.5 30.8 75.6 26.0 C82.2 24.0 86.5 22.2 90 21.7 C93.5 22.2 97.8 24.0 104.4 26.0 C121.5 30.8 140 33.7 160 32.6" fill="none" stroke="url(#gold)" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M28 30.7 C48.6 30.2 65.2 27.6 80 23.9" fill="none" stroke="#fff0a0" stroke-width="1.35" stroke-linecap="round" opacity=".78"/>

    <!-- end caps -->
    <circle cx="20" cy="33.2" r="4.4" fill="url(#goldGlow)" stroke="#714007" stroke-width="1.1"/>
    <circle cx="160" cy="33.2" r="4.4" fill="url(#goldGlow)" stroke="#714007" stroke-width="1.1"/>

    <!-- chains left -->
    <path d="M20 36.8 L8 73.6 M20 36.8 L43 73.6" fill="none" stroke="#9b5a0a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M20 37.2 L9.4 72.7 M20 37.2 L41.7 72.7" fill="none" stroke="#f2c651" stroke-width="1.1" stroke-linecap="round" opacity=".92"/>

    <!-- chains right -->
    <path d="M160 36.8 L137 73.6 M160 36.8 L172 73.6" fill="none" stroke="#9b5a0a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M160 37.2 L138.3 72.7 M160 37.2 L170.6 72.7" fill="none" stroke="#f2c651" stroke-width="1.1" stroke-linecap="round" opacity=".92"/>

    <!-- left pan -->
    <path d="M4 74.7 C12.8 82.2 38 82.2 47 74.7 C38.7 88.4 12.8 88.4 4 74.7 Z" fill="url(#goldGlow)" stroke="#704005" stroke-width="1.25"/>
    <path d="M7.8 75.2 C17 79 34 79 43.3 75.2" fill="none" stroke="#fff0a3" stroke-width="1.3" opacity=".78"/>
    <path d="M7 82 C17.6 87.1 34.3 86.9 44.1 81.8" fill="none" stroke="#7b4406" stroke-width="1" opacity=".5"/>

    <!-- right pan -->
    <path d="M133 74.7 C142 82.2 167.2 82.2 176 74.7 C167.2 88.4 141.3 88.4 133 74.7 Z" fill="url(#goldGlow)" stroke="#704005" stroke-width="1.25"/>
    <path d="M136.7 75.2 C146 79 163 79 172.2 75.2" fill="none" stroke="#fff0a3" stroke-width="1.3" opacity=".78"/>
    <path d="M135.9 81.8 C145.7 86.9 162.4 87.1 173 82" fill="none" stroke="#7b4406" stroke-width="1" opacity=".5"/>

    <!-- base neck -->
    <ellipse cx="90" cy="113.8" rx="15.8" ry="4.6" fill="url(#gold)" stroke="#6f3b04" stroke-width="1.2"/>
    <rect x="78.5" y="114" width="23" height="6.5" rx="2.6" fill="url(#gold)" stroke="#6f3b04" stroke-width="1.1"/>

    <!-- pedestal -->
    <path d="M70 120.1 H110 L116.6 127.5 H63.4 Z" fill="url(#gold)" stroke="#6c3903" stroke-width="1.2"/>
    <path d="M60 128.2 C68 126.4 112 126.4 120 128.2 L125 134.6 C114.2 137.4 65.8 137.4 55 134.6 Z" fill="url(#goldGlow)" stroke="#6b3902" stroke-width="1.3"/>
    <ellipse cx="90" cy="134.2" rx="34.5" ry="5" fill="#8f5207" opacity=".24"/>
    <path d="M62 129.7 C77 127.8 103 127.8 118 129.7" fill="none" stroke="#fff1a5" stroke-width="1.35" opacity=".72"/>
  </g>
</svg>
